services:
  - type: web
    name: scenescout
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: GROQ_API_KEY
        sync: false
      - key: LOCATIONIQ_KEY
        sync: false
      - key: GEONAMES_USERNAME
        sync: false
      - key: FOURSQUARE_API_KEY
        sync: false
